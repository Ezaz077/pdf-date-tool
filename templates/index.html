<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PDF Date Tool</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
        }

        .auto-date {
            background: #f3f4f6;
        }

        .info {
            margin-top: 20px;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 7px;
            color: #555;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>PDF Date Tool</h1>

    <div class="subtitle">
        Internal PDF date-management demo
    </div>


    <label>Upload PDF</label>

    <input
        type="file"
        id="pdfFile"
        accept=".pdf"
    >


    <label>Web Registration Date</label>

    <input
        type="date"
        id="registrationDate"
        onchange="syncDate()"
    >


    <label>Expected Date of Journey</label>

    <input
        type="date"
        id="journeyDate"
    >


    <label>Declaration Date</label>

    <input
        type="date"
        id="declarationDate"
        class="auto-date"
        readonly
    >


    <div class="info">
        Declaration Date automatically follows
        Web Registration Date.
    </div>


    <button onclick="processPDF()">
        Process PDF
    </button>

</div>


<script>

function syncDate() {

    const date =
        document.getElementById("registrationDate").value;

    document.getElementById("declarationDate").value = date;
}


function processPDF() {

    const file =
        document.getElementById("pdfFile").files[0];

    const registration =
        document.getElementById("registrationDate").value;

    const journey =
        document.getElementById("journeyDate").value;


    if (!file) {
        alert("Please upload a PDF.");
        return;
    }


    if (!registration) {
        alert("Please select Web Registration Date.");
        return;
    }


    if (!journey) {
        alert("Please select Expected Date of Journey.");
        return;
    }


    alert(
        "PDF selected successfully.\n\n" +
        "Web Registration Date: " + registration +
        "\nExpected Date of Journey: " + journey +
        "\nDeclaration Date: " + registration
    );

}

</script>

</body>

</html>
